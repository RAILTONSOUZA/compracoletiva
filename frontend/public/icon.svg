<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220">
  <!-- Balão superior (%) -->
  <rect x="20" y="8" width="160" height="100" rx="20" ry="20"
        fill="#0D0618" stroke="#6BBF4E" stroke-width="7"/>
  <!-- Balão inferior (texto) -->
  <rect x="10" y="95" width="180" height="110" rx="20" ry="20"
        fill="#0D0618" stroke="#6BBF4E" stroke-width="7"/>
  <!-- Ponteiro balão inferior -->
  <polygon points="70,200 50,220 90,200"
           fill="#0D0618" stroke="#6BBF4E" stroke-width="7"
           stroke-linejoin="round" paint-order="stroke"/>
  <!-- Símbolo % -->
  <text x="100" y="80" text-anchor="middle"
        font-family="Arial Black, sans-serif" font-size="68" font-weight="900"
        fill="#6C3FC4">%</text>
  <!-- Texto DESCONTO -->
  <text x="100" y="148" text-anchor="middle"
        font-family="Arial Black, sans-serif" font-size="30" font-weight="900"
        fill="#6C3FC4">DESCONTO</text>
  <!-- Texto DO DIA -->
  <text x="100" y="182" text-anchor="middle"
        font-family="Arial Black, sans-serif" font-size="30" font-weight="900"
        fill="#6C3FC4">DO DIA</text>
</svg>
